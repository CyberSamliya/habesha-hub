<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; connect-src https://yfzydixypuronzoeargv.supabase.co; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
<title>Habesha Hub Admin Login</title>
<link rel="stylesheet" href="styles.css?v=20260929-cat4d2">
<style>
.admin-shell{max-width:560px;margin:8vh auto;padding:24px}
.admin-card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px;box-shadow:0 18px 50px rgba(15,23,42,.08)}
.admin-card label{display:block;font-weight:700;margin:16px 0 6px}
.admin-card input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}
.admin-card button{width:100%;margin-top:18px}
.admin-note{font-size:.92rem;color:#475569}
.admin-error{margin-top:14px;color:#991b1b}
</style>
</head>
<body>
<main class="admin-shell">
  <div class="admin-card">
    <div class="eyebrow">Private administration</div>
    <h1>Habesha Hub Admin</h1>
    <p class="admin-note">Authorized administrators only. This page does not create public member accounts.</p>
    <form id="adminLoginForm">
      <label for="adminEmail">Email</label>
      <input id="adminEmail" type="email" autocomplete="username" required>
      <label for="adminPassword">Password</label>
      <input id="adminPassword" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Sign in securely</button>
      <div id="adminLoginMessage" class="admin-error" role="alert" aria-live="polite"></div>
    </form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-login.js"></script>
</body>
</html>
