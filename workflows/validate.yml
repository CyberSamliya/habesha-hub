name: Validate directory data
on:
  push:
    paths: ["directory-data.js", "tools/**", ".github/workflows/validate.yml"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/validate-data.js
